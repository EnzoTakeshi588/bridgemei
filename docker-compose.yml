
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: bridgemei_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro,Z
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  login-api:
    build:
      context: ./pasta-api
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=LoginDb;User=bridgemei_app;Password=${MYSQL_APP_PASSWORD};"
    ports:
      - "5009:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  estoque-api:
    build:
      context: ./EstoqueApi
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=EstoqueDb;User=bridgemei_app;Password=${MYSQL_APP_PASSWORD};"
    ports:
      - "5017:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_LOGIN_URL: http://localhost:5009
        VITE_ESTOQUE_URL: http://localhost:5017
    ports:
      - "5173:80"
    depends_on:
      - login-api
      - estoque-api
    restart: unless-stopped

volumes:
  mysql_data:
